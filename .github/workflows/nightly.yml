name: Nightly

# T-11 (suite de tests completa): flujos E2E + carga corren en el night.
# El CI (ci.yml) mantiene las puertas por PR (calidad + coverage + pureza +
# build + docker/smoke + secrets). Este workflow ejecuta lo NO bloqueante del
# nightly sobre `main`: E2E (Playwright) y carga (Testcontainers perf).

on:
  schedule:
    # 03:00 UTC = 04:00 CET (noche peninsular).
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — Playwright (responsive + flujos)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://nightly:nightly@localhost:5432/nightly?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: "nightly-ci-secret-not-for-production"
      # Solo CI: la suite crea/unse varias ligas por corrida desde una misma IP
      # (3 viewports en paralelo). Relaja el anti-fuerza-bruta de ligas
      # (US-23/US-25) SOLO para el dev server de pruebas; la semántica
      # anti-fuerza-bruta la cubren los tests de integración (rate-limit), no
      # la E2E. En producción NO se fijan estas vars (defaults de env.ts).
      LEAGUE_CREATE_RATE_LIMIT_MAX: "50"
      LEAGUE_JOIN_RATE_LIMIT_MAX: "50"
      LEAGUE_JOIN_LOCKOUT_THRESHOLD: "50"
      # Solo CI: anti-flood de registro (T-12/ADR-0035) — la suite registra
      # ~30 cuentas por corrida desde una misma IP. En producción NO se fija
      # (default 10/hora por IP, app/server/env.ts).
      AUTH_REGISTER_RATE_LIMIT_MAX: "100"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nightly
          POSTGRES_PASSWORD: nightly
          POSTGRES_DB: nightly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Migraciones de BD
        run: npx prisma migrate deploy

      - name: Seed dataset ficticio
        run: npm run seed:fiction

      - name: Instalar Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Arrancar dev server
        run: |
          npm run dev > /tmp/motogp-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health

      - name: Ejecutar E2E (Playwright)
        run: npx playwright test

      - name: Subir reporte HTML de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  load:
    name: Carga — recálculo de GP (T-10) + lockout window (T-11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Test de carga (rendimiento + lockout) — Testcontainers
        run: npm run test:load
